spring.application.name=krishiApp

# ==============================================================================
# 1. POSTGRESQL DATASOURCE CONFIGURATION
# ==============================================================================
# Change 'krishimitra_db' to whatever you named your database in pgAdmin
spring.datasource.url=jdbc:postgresql://localhost:5432/KrishiMitra

# Swap these out with your actual pgAdmin username and password
spring.datasource.username=postgres
spring.datasource.password=BlueHaati48
spring.datasource.driver-class-name=org.postgresql.Driver

# ==============================================================================
# 2. JPA & HIBERNATE SETTINGS
# ==============================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Since you already ran the DDL script manually in pgAdmin, setting this to 'update'
# is perfect. It won't overwrite your tables, but if we add a new column to an Entity
# later, Hibernate will automatically alter the Postgres table for us.
spring.jpa.hibernate.ddl-auto=update

# Top-tier dev move: This prints the actual SQL queries Hibernate runs to your console.
# Incredibly useful for debugging why a query is slow or failing.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

# ==============================================================================
# 3. SERVER SETTINGS
# ==============================================================================
# Port 8080 is standard. Your frontend teammate's Node server is likely on 3000.
server.port=8080

